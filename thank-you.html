<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Thank you for contacting Priyank Saxena.">
    <title>Message sent — Priyank Saxena</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #070a12;
            --text: #edf2ff;
            --muted: #9aa6bd;
            --line: rgba(255, 255, 255, .11);
            --glass: rgba(16, 22, 38, .62);
            --glass2: rgba(255, 255, 255, .055);
            --cyan: #65e7ff;
            --violet: #a98bff;
            --green: #75f0bb;
            --shadow: 0 24px 80px rgba(0, 0, 0, .42);
            --radius: 28px
        }

        * {
            box-sizing: border-box
        }

        html {
            scroll-behavior: smooth
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at 10% 10%, rgba(101, 231, 255, .08), transparent 28%), radial-gradient(circle at 90% 15%, rgba(169, 139, 255, .09), transparent 30%), var(--bg);
            color: var(--text);
            font-family: Inter, system-ui, sans-serif;
            overflow: hidden
        }

        a {
            text-decoration: none;
            color: inherit
        }

        #bg {
            position: fixed;
            inset: 0;
            z-index: -3;
            background: linear-gradient(rgba(255, 255, 255, .028) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, .028) 1px, transparent 1px);
            background-size: 64px 64px;
            mask-image: linear-gradient(to bottom, black, transparent 90%);
            animation: gridmove 24s linear infinite
        }

        @keyframes gridmove {
            to {
                background-position: 64px 64px
            }
        }

        .orb {
            position: fixed;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            filter: blur(90px);
            opacity: .17;
            z-index: -2;
            pointer-events: none;
            animation: float 12s ease-in-out infinite
        }

        .o1 {
            background: var(--cyan);
            left: -180px;
            top: 20%
        }

        .o2 {
            background: var(--violet);
            right: -180px;
            top: 55%;
            animation-delay: -5s
        }

        .o3 {
            background: var(--green);
            left: 45%;
            top: -250px;
            animation-delay: -8s
        }

        @keyframes float {
            50% {
                transform: translate3d(70px, 40px, 0) scale(1.08)
            }
        }

        #cursor {
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(101, 231, 255, .11), transparent 68%);
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 20;
            mix-blend-mode: screen
        }

        .container {
            width: min(1160px, 92%);
            margin: auto
        }

        .mono {
            font-family: 'DM Mono', monospace
        }

        .eyebrow {
            font: 500 12px 'DM Mono';
            letter-spacing: .18em;
            text-transform: uppercase;
            color: var(--cyan)
        }

        nav {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: min(1120px, 92%);
            padding: 12px 14px;
            border: 1px solid var(--line);
            background: rgba(8, 12, 23, .72);
            backdrop-filter: blur(18px);
            border-radius: 18px;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 40px rgba(0, 0, 0, .2)
        }

        .brand {
            font-weight: 800;
            letter-spacing: -.03em
        }

        .brand span {
            color: var(--cyan)
        }

        .navcta {
            padding: 9px 14px;
            border: 1px solid rgba(101, 231, 255, .35);
            border-radius: 12px;
            background: rgba(101, 231, 255, .08);
            color: var(--cyan);
            font-size: 13px;
            transition: .3s
        }

        .navcta:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(101, 231, 255, .1)
        }

        main {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 90px 0
        }

        .card {
            width: min(700px, 92%);
            padding: 52px;
            text-align: center;
            border: 1px solid var(--line);
            background: linear-gradient(145deg, rgba(255, 255, 255, .075), rgba(255, 255, 255, .025));
            backdrop-filter: blur(18px);
            box-shadow: var(--shadow);
            border-radius: var(--radius);
            position: relative;
            overflow: hidden;
            animation: enter .8s cubic-bezier(.2, .8, .2, 1) both
        }

        @keyframes enter {
            from {
                opacity: 0;
                transform: translateY(25px) scale(.98)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        .icon {
            width: 82px;
            height: 82px;
            margin: 0 auto 25px;
            border-radius: 25px;
            display: grid;
            place-items: center;
            border: 1px solid rgba(117, 240, 187, .35);
            background: rgba(117, 240, 187, .08);
            color: var(--green);
            font-size: 37px;
            box-shadow: 0 0 45px rgba(117, 240, 187, .08);
            animation: pulse 2.5s ease-in-out infinite
        }

        @keyframes pulse {
            50% {
                transform: translateY(-5px);
                box-shadow: 0 0 65px rgba(117, 240, 187, .14)
            }
        }

        h1 {
            font-size: clamp(38px, 6vw, 62px);
            line-height: 1;
            letter-spacing: -.06em;
            margin: 0 0 18px
        }

        h1 span {
            background: linear-gradient(100deg, #fff 10%, var(--cyan), #c5b7ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent
        }

        .lead {
            font-size: 17px;
            line-height: 1.75;
            color: var(--muted);
            max-width: 560px;
            margin: 0 auto 30px
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap
        }

        .btn {
            border: 1px solid var(--line);
            padding: 13px 18px;
            border-radius: 13px;
            background: var(--glass2);
            color: #fff;
            transition: .3s
        }

        .btn:hover {
            transform: translateY(-3px);
            border-color: rgba(101, 231, 255, .5);
            box-shadow: 0 12px 30px rgba(101, 231, 255, .09)
        }

        .btn.primary {
            background: linear-gradient(135deg, rgba(101, 231, 255, .16), rgba(169, 139, 255, .13));
            border-color: rgba(101, 231, 255, .4)
        }

        .hint {
            margin-top: 28px;
            color: #69758b;
            font: 11px 'DM Mono'
        }

        @media(max-width:600px) {
            .card {
                padding: 38px 24px
            }

            .icon {
                width: 70px;
                height: 70px
            }

            .lead {
                font-size: 15px
            }
        }

.brand {
    display: inline-flex;
    align-items: center;
    text-decoration: none;
    transition:
        transform .4s cubic-bezier(.22,1,.36,1),
        text-shadow .4s ease,
        letter-spacing .4s ease;
}

.brand span {
    display: inline-block;
    transition:
        transform .4s cubic-bezier(.22,1,.36,1),
        text-shadow .4s ease;
}

.brand:hover {
    transform: translateY(-2px);
    letter-spacing: .04em;
    text-shadow:
        0 0 12px rgba(255,255,255,.25),
        0 0 28px rgba(130,150,255,.18);
}

.brand:hover span {
    transform: translateY(-3px) scale(1.25);
    text-shadow:
        0 0 10px rgba(255,255,255,.5),
        0 0 22px rgba(130,150,255,.4);
}
    </style>
</head>

<body>
    <div id="bg"></div>
    <div class="orb o1"></div>
    <div class="orb o2"></div>
    <div class="orb o3"></div>
    <div id="cursor"></div>
    <nav><a class="brand" href="index.html">PS<span>.</span></a><a class="navcta" href="index.html">Back to portfolio
            →</a></nav>
    <main>
        <section class="card">
            <div class="icon">✓</div>
            <div class="eyebrow">Message received</div>
            <h1>Thanks for <span>reaching out.</span></h1>
            <p class="lead">Your message has been sent successfully. Priyank will get it in his inbox and can follow up
                with you directly.</p>
            <div class="actions"><a class="btn primary" href="index.html">Return to portfolio ↗</a><a class="btn"
                    href="mailto:priyank.saxena.dev@gmail.com">Email directly</a></div>
            <div class="hint">AUTOMATION · ENGINEERING · IMPACT</div>
        </section>
    </main>
    <script>
        const cursor = document.getElementById('cursor'); window.addEventListener('pointermove', e => {cursor.style.left = e.clientX + 'px'; cursor.style.top = e.clientY + 'px'});
    </script>
</body>

</html>
